services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungku-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_KEY: base64:FXeGdT/dWrJOdb6cqDxf0IUD0ZOHpb0+6iB9L1C4o8k=
      DB_CONNECTION: mysql
