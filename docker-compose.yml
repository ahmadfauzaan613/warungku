      DB_PORT: 3306
      DB_DATABASE: warungku
      DB_USERNAME: warungku
      DB_PASSWORD: warungku
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "8000:8000"
    networks:
